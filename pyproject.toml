[project]
name = "project-1-rag-pipeline"
version = "0.1.0"
description = "Production RAG Pipeline with Evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
    "openai>=1.12.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "sqlalchemy>=2.0.25",
    "bm25s>=0.1.7",
    "numpy>=1.26.4",
    "tiktoken>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "ragas>=0.1.0", 
    "datasets>=2.17.0"
]
